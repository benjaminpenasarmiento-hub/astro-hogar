name: Repair app source now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete App.tsx
        run: |
          git checkout d80abbbca5a5b84811e89f22556c84e8eea42095 -- src/App.tsx
          sed -i 's#./components/OnboardingWizard"#./components/OnboardingWizardV2"#' src/App.tsx
          sed -i 's/home?.code || localStorage.getItem("astro_home_code") || "HOGARPELUDO"/home?.code || localStorage.getItem("astro_home_code") || ""/' src/App.tsx

      - name: Verify and commit
        run: |
          grep -q 'export default function App' src/App.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "chore(automation): restore complete app source"
          git rm .github/workflows/repair-app-now.yml repair-trigger.txt 2>/dev/null || true
          git commit -m "chore(automation): remove temporary repair files" || true
          git push
